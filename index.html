<script>
const BASE_URL="https://kingcoinsinvesment.github.io/Victor-/";
const OPAY_NUM="6587483968";
const TELEGRAM_LINK="https://t.me/kingcoi"; 
const REF_BONUS1=500,REF_BONUS2=200,TG_BONUS=200,ADMIN_CODE="KING123";

let currentUser=JSON.parse(localStorage.getItem('kingUser'))||null;
let isAdmin=localStorage.getItem('isAdmin')==='true'; // NEW
let balance=parseFloat(localStorage.getItem('kingBalance'))||1000;
let allUsers=JSON.parse(localStorage.getItem('allKingUsers'))||[];
let transactions=JSON.parse(localStorage.getItem('kingTransactions'))||[];
let withdrawals=JSON.parse(localStorage.getItem('kingWithdrawals'))||[];
let deposits=JSON.parse(localStorage.getItem('kingDeposits'))||[];
let marketCoins=[{name:"Bitcoin",symbol:"BTC",icon:"₿",price:54843286432,change:0.15},{name:"King Coin",symbol:"KING",icon:"👑",price:402.07,change:-0.08}];

function showPopup(t,m){document.getElementById('popupTitle').innerText=t;document.getElementById('popupMessage').innerText=m;document.getElementById('popup').style.display='flex';}
function closePopup(){document.getElementById('popup').style.display='none';}
function generateRefCode(n){return "KING-"+n.toUpperCase().replace(/\s/g,'').substring(0,8)+Math.floor(Math.random()*100);}

function init(){
  if(currentUser){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('app').style.display='block';
    
    // HIDE ADMIN BUTTON FOR NORMAL USERS
    document.querySelector('[onclick="showPage(\'adminPage\')"]').style.display = isAdmin? 'flex' : 'none';
    
    updateUI();loadMarket();
  }else{
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('app').style.display='none';
  }
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[onclick="showPage('${id}')"]`)?.classList.add('active');
  if(id=='historyPage')loadHistory();
  if(id=='adminPage' && isAdmin)loadAdmin(); // ONLY LOAD IF ADMIN
  if(id=='marketPage')loadMarket();
}

function toggleSignup(){const box=document.getElementById('signupBox');box.style.display=box.style.display=='none'?'block':'none';}

function signup(){
  const n=document.getElementById('signupName').value,e=document.getElementById('signupEmail').value,p=document.getElementById('signupPass').value;
  if(!n||!e||!p){showPopup('Error','Fill all fields');return;}
  if(allUsers.find(u=>u.email==e)){showPopup('Error','Email exists');return;}
  const ref=generateRefCode(n);
  const url=new URLSearchParams(window.location.search).get('ref');
  const user={name:n,email:e,pass:p,refCode:ref,balance:1000,tg:false,investments:[],totalInvested:0,totalEarned:0,referrer:url,level1:[],lastShare:0};
  allUsers.push(user);
  if(url){let r=allUsers.find(u=>u.refCode==url);if(r){r.level1.push(e);r.balance+=REF_BONUS1;user.balance+=REF_BONUS1;addTransaction(r.email,'referral',REF_BONUS1,'Level 1 Referral');addTransaction(e,'referral',REF_BONUS1,'Welcome Bonus');}}
  localStorage.setItem('allKingUsers',JSON.stringify(allUsers));
  currentUser=user;balance=user.balance;isAdmin=false; // NORMAL USER
  localStorage.setItem('kingUser',JSON.stringify(currentUser));localStorage.setItem('kingBalance',balance);localStorage.setItem('isAdmin','false');
  init();
}

function login(){
  const e=document.getElementById('loginEmail').value,p=document.getElementById('loginPass').value;
  const u=allUsers.find(x=>x.email==e&&x.pass==p);
  if(u){
    currentUser=u;balance=u.balance;isAdmin=false;
    localStorage.setItem('kingUser',JSON.stringify(u));localStorage.setItem('kingBalance',balance);localStorage.setItem('isAdmin','false');
    init();
  }else{showPopup('Error','Invalid login');}
}

function adminLogin(){
  if(document.getElementById('adminPass').value==ADMIN_CODE){
    isAdmin=true;
    localStorage.setItem('isAdmin','true');
    document.getElementById('authScreen').style.display='none';
    document.getElementById('app').style.display='block';
    showPage('adminPage'); // GO STRAIGHT TO ADMIN
  }else{showPopup('Error','Wrong Admin Code');}
}

function logout(){
  localStorage.removeItem('kingUser');
  localStorage.setItem('isAdmin','false');
  currentUser=null;isAdmin=false;
  init();
}

//... rest of your functions stay the same: updateUI, loadMarket, switchTab, depositRequest, withdraw, loadAdmin, approveWithdraw, rejectWithdraw, approveDeposit, rejectDeposit, invest, addTransaction, loadHistory, copyCode, copyLink, shareAndEarn, joinTelegram...

function updateUI(){
  if(!currentUser)return;
  document.getElementById('profileName').innerText=currentUser.name;
  document.getElementById('profileEmail').innerText=currentUser.email;
  document.getElementById('profileAvatar').innerText=currentUser.name[0];
  const REF=`${BASE_URL}?ref=${currentUser.refCode}`;
  document.getElementById('refCodeBox').innerText=currentUser.refCode;
  document.getElementById('refLinkBox').innerText=REF;
  document.getElementById('balance').innerText=balance.toFixed(2);
  document.getElementById('withdrawBalance').innerText=balance.toFixed(2);
  document.getElementById('totalInvested').innerText=currentUser.totalInvested||0;
  document.getElementById('totalEarned').innerText=currentUser.totalEarned||0;
  document.getElementById('totalReferred').innerText=currentUser.level1?currentUser.level1.length:0;

  const now=Date.now();
  const lastShare=currentUser.lastShare||0;
  const shareBtn=document.getElementById('shareBtn');
  if(now-lastShare<24*60*60*1000){
    shareBtn.disabled=true;
    let hrs=Math.ceil((24*60*60*1000-(now-lastShare))/3600000);
    shareBtn.innerText=`⏰ Share again in ${hrs}h`;
  }else{
    shareBtn.disabled=false;
    shareBtn.innerText='📤 Share & Earn ₦100';
  }

  const tgBtn=document.getElementById('tgBtn');
  if(currentUser.tg){
    tgBtn.disabled=true;
    tgBtn.innerText='✓ Telegram Claimed';
  }else{
    tgBtn.disabled=false;
    tgBtn.innerText='Join Telegram +₦200';
  }
}

function loadMarket(){const list=document.getElementById('marketList');list.innerHTML=marketCoins.map(coin=>{const changeClass=coin.change>=0?'status-approved':'status-rejected';return `<div class="coin"><div><b>${coin.name}</b><br><small>${coin.symbol}</small></div><div><b>₦${coin.price.toLocaleString()}</b><br><small class="${changeClass}">${coin.change}%</small></div></div>`}).join('');}

function switchTab(tab){
  if(tab=='withdraw'){
    document.getElementById('withdrawTab').style.display='block';
    document.getElementById('depositTab').style.display='none';
    document.getElementById('tabWithdraw').classList.remove('btn-ghost');document.getElementById('tabWithdraw').classList.add('btn');
    document.getElementById('tabDeposit').classList.remove('btn');document.getElementById('tabDeposit').classList.add('btn-ghost');
  } else {
    document.getElementById('withdrawTab').style.display='none';
    document.getElementById('depositTab').style.display='block';
    document.getElementById('tabDeposit').classList.remove('btn-ghost');document.getElementById('tabDeposit').classList.add('btn');
    document.getElementById('tabWithdraw').classList.remove('btn');document.getElementById('tabWithdraw').classList.add('btn-ghost');
  }
}

function depositRequest(){
  const amt=parseFloat(document.getElementById('depositAmount').value);
  const name=document.getElementById('depositName').value;
  const ref=document.getElementById('depositRef').value;
  if(!amt ||!name ||!ref){ showPopup('Error','Fill all fields'); return; }
  deposits.push({id: Date.now().toString(),email: currentUser.email,name: currentUser.name,amount: amt,senderName: name,ref: ref,status: 'pending',date: new Date().toLocaleString()});
  localStorage.setItem('kingDeposits', JSON.stringify(deposits));
  addTransaction(currentUser.email,'deposit',amt,`Pending Deposit: ${ref}`);
  showPopup('Deposit Submitted',`₦${amt} sent for admin approval`);
  document.getElementById('depositAmount').value='';document.getElementById('depositName').value='';document.getElementById('depositRef').value='';
}

function withdraw(){
  const amt=parseFloat(document.getElementById('withdrawAmount').value);
  const acc=document.getElementById('withdrawAccount').value;
  const name=document.getElementById('withdrawName').value;
  if(amt<7000){showPopup('Error','Min ₦7000');return;}
  if(acc.length!=10){showPopup('Error','Invalid account');return;}
  if(balance<amt){showPopup('Error','Insufficient');return;}
  balance-=amt;currentUser.balance=balance;
  withdrawals.push({id:Date.now().toString(),email:currentUser.email,name:currentUser.name,amount:amt,account:acc,accountName:name,status:'pending',date:new Date().toLocaleString()});
  localStorage.setItem('kingWithdrawals',JSON.stringify(withdrawals));
  let i=allUsers.findIndex(x=>x.email==currentUser.email);allUsers[i]=currentUser;localStorage.setItem('allKingUsers',JSON.stringify(allUsers));
  localStorage.setItem('kingUser',JSON.stringify(currentUser));localStorage.setItem('kingBalance',balance);
  addTransaction(currentUser.email,'withdraw',amt,`Pending Withdrawal to ${acc}`);
  showPopup('Success',`₦${amt} withdrawal request sent. Status: Pending`);
  updateUI();
}

function loadAdmin(){
  document.getElementById('adminTotalUsers').innerText=allUsers.length;
  let pending=withdrawals.filter(w=>w.status=='pending');
  document.getElementById('adminWithdrawList').innerHTML=pending.map(w=>`<div class="admin-card"><b>${w.name}</b><br>₦${w.amount}<br>${w.account}<br><span class="status-pending">PENDING</span><br><button class="btn btn-green" onclick="approveWithdraw('${w.id}')">Approve Withdraw</button><button class="btn btn-red" onclick="rejectWithdraw('${w.id}')">Reject</button></div>`).join('')||'<p>No pending withdrawals</p>';
  let pendingDep=deposits.filter(d=>d.status=='pending');
  document.getElementById('adminDepositList').innerHTML=pendingDep.map(d=>`<div class="admin-card"><b>DEPOSIT: ${d.name}</b><br>₦${d.amount}<br>Ref: ${d.ref}<br><button class="btn btn-green" onclick="approveDeposit('${d.id}')">Approve Deposit</button><button class="btn btn-red" onclick="rejectDeposit('${d.id}')">Reject</button></div>`).join('')||'<p>No pending deposits</p>';
  document.getElementById('adminUserList').innerHTML=allUsers.map(u=>`<div class="admin-card"><b>${u.name}</b><br>${u.email}<br>₦${u.balance.toFixed(2)}</div>`).join('');
}

function approveWithdraw(id){
  let w=withdrawals.find(x=>x.id==id);w.status='approved';
  localStorage.setItem('kingWithdrawals',JSON.stringify(withdrawals));
  let tx=transactions.find(t=>t.desc.includes(w.account) && t.type=='withdraw');
  if(tx) tx.desc = tx.desc.replace('Pending','Approved');
  localStorage.setItem('kingTransactions',JSON.stringify(transactions));
  showPopup('Approved',`₦${w.amount} withdrawal approved`);loadAdmin();loadHistory();
}
function rejectWithdraw(id){
  let w=withdrawals.find(x=>x.id==id);w.status='rejected';
  let u=allUsers.find(x=>x.email==w.email);u.balance+=w.amount;
  localStorage.setItem('allKingUsers',JSON.stringify(allUsers));localStorage.setItem('kingWithdrawals',JSON.stringify(withdrawals));
  showPopup('Rejected','Withdrawal rejected and refunded');loadAdmin();loadHistory();
}
function approveDeposit(id){
  let d=deposits.find(x=>x.id==id);d.status='approved';
  let u=allUsers.find(x=>x.email==d.email);u.balance+=d.amount;
  localStorage.setItem('allKingUsers',JSON.stringify(allUsers));localStorage.setItem('kingDeposits',JSON.stringify(deposits));
  addTransaction(d.email,'deposit',d.amount,'Deposit Approved');
  showPopup('Approved',`₦${d.amount} credited`);loadAdmin();loadHistory();
}
function rejectDeposit(id){let d=deposits.find(x=>x.id==id);d.status='rejected';localStorage.setItem('kingDeposits',JSON.stringify(deposits));showPopup('Rejected','Deposit rejected');loadAdmin();}

function invest(amount,plan,days,profit){if(balance<amount){showPopup('Error','Low balance');return;}balance-=amount;currentUser.balance=balance;currentUser.totalInvested=(currentUser.totalInvested||0)+amount;currentUser.investments.push({plan,amount,days,profit});let i=allUsers.findIndex(x=>x.email==currentUser.email);allUsers[i]=currentUser;localStorage.setItem('allKingUsers',JSON.stringify(allUsers));localStorage.setItem('kingUser',JSON.stringify(currentUser));localStorage.setItem('kingBalance',balance);addTransaction(currentUser.email,'invest',amount,`${plan} Plan`);showPopup('Invested',`₦${amount} in ${plan}`);updateUI();}
function addTransaction(email,type,amount,desc){transactions.push({email,type,amount,desc,date:new Date().toLocaleString()});localStorage.setItem('kingTransactions',JSON.stringify(transactions));}
function loadHistory(){document.getElementById('historyList').innerHTML=transactions.filter(t=>t.email==currentUser.email).map(t=>`<div class="history-item"><b>${t.type.toUpperCase()}</b> - ₦${t.amount}<br><small>${t.desc}<br>${t.date}</small></div>`).join('')||'<p>No transactions</p>';}
function copyCode(){navigator.clipboard.writeText(document.getElementById('refCodeBox').innerText);showPopup('Copied','Code copied');}
function copyLink(){navigator.clipboard.writeText(document.getElementById('refLinkBox').innerText);showPopup('Copied','Link copied');}

function shareAndEarn(){
  const now=Date.now();
  if(currentUser.lastShare && now-currentUser.lastShare<24*60*60*1000){
    showPopup('Limit','Come back in 24 hours');
    return;
  }
  navigator.clipboard.writeText(document.getElementById('refLinkBox').innerText);
  balance+=100;currentUser.balance=balance;currentUser.lastShare=now;
  let i=allUsers.findIndex(x=>x.email==currentUser.email);allUsers[i]=currentUser;
  localStorage.setItem('allKingUsers',JSON.stringify(allUsers));localStorage.setItem('kingUser',JSON.stringify(currentUser));localStorage.setItem('kingBalance',balance);
  addTransaction(currentUser.email,'referral',100,'Share Bonus');
  showPopup('₦100 Earned','Link copied! Return in 24hrs');updateUI();
}

function joinTelegram(){
  window.open(TELEGRAM_LINK,'_blank');
  if(currentUser.tg){
    showPopup('Info','Already claimed Telegram bonus');
    return;
  }
  currentUser.balance+=TG_BONUS;balance=currentUser.balance;currentUser.tg=true;
  let i=allUsers.findIndex(x=>x.email==currentUser.email);allUsers[i]=currentUser;
  localStorage.setItem('allKingUsers',JSON.stringify(allUsers));localStorage.setItem('kingUser',JSON.stringify(currentUser));localStorage.setItem('kingBalance',balance);
  addTransaction(currentUser.email,'deposit',TG_BONUS,'Telegram Bonus');
  showPopup('Success',`₦200 added`);updateUI();
}

if(allUsers.length==0){allUsers.push({name:"Admin",email:"admin@king.com",pass:"1234",refCode:"KING-ADMIN",balance:100000,tg:true,investments:[],totalInvested:0,totalEarned:0,level1:[],lastShare:0});localStorage.setItem('allKingUsers',JSON.stringify(allUsers));}
init();
</script>
