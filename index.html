<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>King Coins Investment</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0F;--card:#15151D;--card2:#1A1A24;--gold:#FFC107;--gold-dark:#FFA000;--text:#F5F5F7;--text2:#A1A1AA;--green:#00C896;--red:#FF3B30;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:90px}
.page{display:none}.page.active{display:block}
.topbar{padding:20px;background:var(--card);border-bottom:1px solid #222}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:var(--gold)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:14px 0;border-top:1px solid #222;z-index:99}
.nav button{background:none;border:none;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.nav button.active{color:var(--gold)}
.container{padding:20px}
.card{background:var(--card);padding:24px;border-radius:20px;margin:16px 0;border:1px solid #222}
.balance-card{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;border-radius:24px;padding:28px;margin:16px 0}
.btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;border:none;padding:18px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
.btn-red{background:var(--red);color:white}
.btn-green{background:var(--green);color:#000}
.input-group{margin:16px 0}
.input-group label{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:8px;display:block}
input{width:100%;padding:16px;background:var(--card2);border:1px solid #2A2A35;border-radius:12px;color:var(--text);font-size:15px}
.section-title{font-size:22px;font-weight:800;margin:24px 20px 12px}
.popup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:1000}
.popup-box{background:var(--card);padding:30px;border-radius:24px;text-align:center;max-width:360px;width:90%}
.admin-card{background:var(--card2);padding:16px;border-radius:14px;margin:12px 0;border:1px solid #2A2A35}
.otp-box{display:flex;gap:8px;justify-content:center;margin:20px 0}
.otp-box input{width:50px;text-align:center;font-size:20px;font-weight:800}
</style>
</head>
<body>

<div class="popup" id="popup"><div class="popup-box"><h3 id="popupTitle" style="color:var(--gold);margin-bottom:12px">Notice</h3><p id="popupMessage" style="margin-bottom:20px"></p><button class="btn" onclick="closePopup()">OK</button></div></div>

<!-- AUTH SCREEN -->
<div id="authScreen" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px">
<div style="text-align:center;margin-bottom:30px"><span style="font-size:50px">👑</span><h1 style="color:var(--gold)">KING COINS</h1></div>
<div class="card">
<div id="registerBox" style="display:none">
<div class="input-group"><label>Full Name</label><input type="text" id="regName"></div>
<div class="input-group"><label>Email</label><input type="email" id="regEmail"></div>
<div class="input-group"><label>Password</label><input type="password" id="regPass"></div>
<div class="input-group"><label>Referral Code (Optional)</label><input type="text" id="regRef"></div>
<button class="btn" onclick="sendOTP()">Send OTP to Email</button>
<p style="text-align:center;margin-top:12px"><a onclick="toggleAuth()" style="color:var(--gold)">Already have account? Login</a></p>
</div>

<!-- OTP VERIFICATION BOX -->
<div id="otpBox" style="display:none">
<h3 style="text-align:center">Verify Your Email</h3>
<p style="text-align:center;color:var(--text2);font-size:13px">We sent a 6-digit code to <span id="otpEmailShow"></span></p>
<div class="otp-box">
<input type="text" maxlength="1" oninput="moveOTP(0)"><input type="text" maxlength="1" oninput="moveOTP(1)">
<input type="text" maxlength="1" oninput="moveOTP(2)"><input type="text" maxlength="1" oninput="moveOTP(3)">
<input type="text" maxlength="1" oninput="moveOTP(4)"><input type="text" maxlength="1" oninput="moveOTP(5)">
</div>
<button class="btn" onclick="verifyOTP()">Verify & Create Account</button>
<button class="btn" style="background:transparent;border:1px solid var(--text2);color:var(--text2)" onclick="backToReg()">Back</button>
</div>

<div id="loginBox">
<div class="input-group"><label>Email</label><input type="email" id="loginEmail"></div>
<div class="input-group"><label>Password</label><input type="password" id="loginPass"></div>
<button class="btn" onclick="login()">Login</button>
<p style="text-align:center;margin-top:12px"><a onclick="toggleAuth()" style="color:var(--gold)">Don't have account? Register</a></p>
</div>
</div>
</div>

<!-- APP -->
<div id="app" style="display:none">
<div class="topbar"><div class="logo"><span>👑</span> KING COINS</div></div>

<div id="homePage" class="page active"><div class="container">
<div class="balance-card"><h3>PORTFOLIO BALANCE</h3><h1>₦<span id="balance">1000.00</span></h1></div>
</div></div>

<div id="profilePage" class="page"><div class="container"><h2 class="section-title">Profile</h2>
<div class="card" style="text-align:center">
<div style="font-size:50px;background:var(--gold);color:#000;width:70px;height:70px;border-radius:50%;margin:0 auto;line-height:70px;font-weight:800" id="profileAvatar">G</div>
<h3 id="profileName"></h3><p id="profileEmail" style="color:var(--text2)"></p>
<button class="btn btn-red" onclick="logout()">Logout</button>
</div></div></div>

<div class="nav">
<button onclick="showPage('homePage')" class="active"><div>🏠</div><span>Home</span></button>
<button onclick="showPage('profilePage')"><div>👤</div><span>Profile</span></button>
</div>
</div>

<script>
const ADMIN_CODE="KING123";
let currentUser=JSON.parse(localStorage.getItem('kingUser'))||null;
let balance=parseFloat(localStorage.getItem('kingBalance'))||1000;
let allUsers=JSON.parse(localStorage.getItem('allKingUsers'))||[];
let deviceID=localStorage.getItem('kingDeviceID')||crypto.randomUUID();
localStorage.setItem('kingDeviceID',deviceID);

let tempUser={}; // stores user data before OTP verify
let generatedOTP="";

function showPopup(t,m){document.getElementById('popupTitle').innerText=t;document.getElementById('popupMessage').innerText=m;document.getElementById('popup').style.display='flex';}
function closePopup(){document.getElementById('popup').style.display='none';}
function toggleAuth(){document.getElementById('loginBox').style.display=document.getElementById('loginBox').style.display=='none'?'block':'none';document.getElementById('registerBox').style.display=document.getElementById('registerBox').style.display=='none'?'block':'none';}
function generateRefCode(n){return "KING-"+n.toUpperCase().replace(/\s/g,'').substring(0,8)+Math.floor(Math.random()*100);}

function init(){
  if(currentUser){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('app').style.display='block';
    updateUI();
  }else{
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('app').style.display='none';
  }
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// STEP 1: SEND OTP
function sendOTP(){
  const name=document.getElementById('regName').value;
  const email=document.getElementById('regEmail').value;
  const pass=document.getElementById('regPass').value;

  // ANTI-FRAUD CHECK
  const deviceUsed=allUsers.find(x=>x.deviceID==deviceID);
  if(deviceUsed){showPopup('Blocked','This device already has an account');return;}
  if(allUsers.find(x=>x.email==email)){showPopup('Error','Email already exists');return;}

  tempUser={name,email,pass,refCode:generateRefCode(name),balance:1000,deviceID:deviceID};
  generatedOTP=Math.floor(100000+Math.random()*900000).toString(); // 6 digit OTP

  document.getElementById('otpEmailShow').innerText=email;
  document.getElementById('registerBox').style.display='none';
  document.getElementById('otpBox').style.display='block';

  // NOTE: This is DEMO OTP. In real site you need to send via EmailJS/SMTP
  showPopup('OTP Sent',`Demo OTP: ${generatedOTP} \n\nIn real site this will go to ${email}`);
  console.log("OTP:",generatedOTP); // so you can see it
}

// STEP 2: VERIFY OTP
function verifyOTP(){
  const inputs=document.querySelectorAll('.otp-box input');
  const enteredOTP=Array.from(inputs).map(i=>i.value).join('');

  if(enteredOTP!=generatedOTP){showPopup('Error','Invalid OTP');return;}

  allUsers.push(tempUser);
  localStorage.setItem('allKingUsers',JSON.stringify(allUsers));
  showPopup('Success','Account created & verified. Login now');
  backToReg();toggleAuth();
}

function backToReg(){
  document.getElementById('otpBox').style.display='none';
  document.getElementById('registerBox').style.display='block';
  document.querySelectorAll('.otp-box input').forEach(i=>i.value='');
}

function moveOTP(i){
  const inputs=document.querySelectorAll('.otp-box input');
  if(inputs[i].value.length==1 && i<5) inputs[i+1].focus();
}

function login(){
  const e=document.getElementById('loginEmail').value,p=document.getElementById('loginPass').value;
  const u=allUsers.find(x=>x.email==e&&x.pass==p);
  if(u){currentUser=u;balance=u.balance;init();}else{showPopup('Error','Invalid login');}
}

function updateUI(){
  if(!currentUser)return;
  document.getElementById('profileName').innerText=currentUser.name;
  document.getElementById('profileEmail').innerText=currentUser.email;
  document.getElementById('profileAvatar').innerText=currentUser.name[0];
  document.getElementById('balance').innerText=balance.toFixed(2);
}

function logout(){localStorage.removeItem('kingUser');currentUser=null;init();}

// AUTO CREATE ADMIN
if(allUsers.length==0){
  allUsers.push({name:"Admin",email:"admin@king.com",pass:"1234",refCode:"KING-ADMIN",balance:100000,deviceID:"admin-device"});
  localStorage.setItem('allKingUsers',JSON.stringify(allUsers));
}
init();
</script>
</body>
</html>
