<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>King Coins Investment</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0F; --card:#15151D; --card2:#1A1A24; --gold:#FFC107; --gold-dark:#FFA000;
  --text:#F5F5F7; --text2:#A1A1AA; --green:#00C896; --red:#FF3B30;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:90px}
.page{display:none;padding:0}
.page.active{display:block}
.topbar{padding:20px;background:var(--card);border-bottom:1px solid #222}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:var(--gold)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:14px 0;border-top:1px solid #222;z-index:99}
.nav button{background:none;border:none;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.nav button.active{color:var(--gold)}
.nav button div{font-size:22px}
.container{padding:20px}
.card{background:var(--card);padding:24px;border-radius:20px;margin:16px 0;border:1px solid #222}
.balance-card{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;border-radius:24px;padding:28px;margin:16px 0}
.btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;border:none;padding:18px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
.btn:disabled{background:#2A2A35;color:#555}
.btn-red{background:var(--red);color:white}
.btn-tg{background:#0088cc;color:white}
.btn-ghost{background:transparent;border:2px solid var(--gold);color:var(--gold)}
.btn-green{background:var(--green);color:#000}
.input-group{margin:16px 0}
.input-group label{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:8px;display:block}
input{width:100%;padding:16px;background:var(--card2);border:1px solid #2A2A35;border-radius:12px;color:var(--text);font-size:15px;font-weight:500}
.section-title{font-size:22px;font-weight:800;margin:24px 20px 12px}
.popup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:1000}
.popup-box{background:var(--card);padding:30px;border-radius:24px;text-align:center;max-width:360px;width:90%;border:1px solid #222}
.toast{position:fixed;bottom:100px;left:16px;right:16px;background:var(--card2);border-left:4px solid var(--green);padding:16px;border-radius:12px;display:none;z-index:998;font-weight:600}
.admin-card{background:var(--card2);padding:16px;border-radius:14px;margin:12px 0;border:1px solid #2A2A35}
.status-pending{color:#FFA000}
.status-approved{color:var(--green)}
/* MARKET STYLES */
.coin{padding:16px;border-radius:16px;background:var(--card);margin:12px 0}
.coin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.coin-left{display:flex;align-items:center;gap:12px}
.coin-icon{font-size:28px}
.coin-name{font-weight:700;font-size:16px}
.coin-price{font-weight:800;font-size:18px}
.coin-change{font-size:12px;font-weight:700}
.change-up{color:var(--green)}
.change-down{color:var(--red)}
.trade-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-buy{background:var(--green);color:#000}
.btn-sell{background:var(--red);color:#fff}
</style>
</head>
<body>

<div class="toast" id="liveToast"></div>
<div class="popup" id="popup"><div class="popup-box"><h3 id="popupTitle" style="color:var(--gold);margin-bottom:12px">Notice</h3><p id="popupMessage" style="margin-bottom:20px"></p><button class="btn" onclick="closePopup()">OK</button></div></div>

<!-- AUTH SCREEN SAME AS BEFORE -->
<div id="authScreen" class="auth-wrap">
<div class="auth-logo"><span>👑</span><h1>KING COINS</h1></div>
<div class="auth-card">
<div class="auth-title">Welcome Back</div>
<div id="loginBox">
<div class="input-group"><label>Email</label><input type="email" id="loginEmail"></div>
<div class="input-group"><label>Password</label><input type="password" id="loginPass"></div>
<button class="btn" onclick="login()">Login</button>
</div>
</div>
</div>

<!-- APP -->
<div id="app" style="display:none">
<div class="topbar"><div class="logo"><span>👑</span> KING COINS</div></div>

<!-- HOME -->
<div id="homePage" class="page active"><div class="container">
<div class="balance-card"><h3>PORTFOLIO BALANCE</h3><h1>₦<span id="balance">1000.00</span></h1></div>
</div></div>

<!-- MARKET PAGE WITH BUY/SELL -->
<div id="marketPage" class="page">
<h2 class="section-title">📊 Live Market - Trade KING</h2>
<div class="container">
<div id="marketList"></div>
<p style="text-align:center;color:var(--text2);font-size:12px">Prices update every 3 seconds</p>
</div>
</div>

<!-- OTHER PAGES SAME -->
<div id="investPage" class="page">Invest Page</div>
<div id="withdrawPage" class="page">Withdraw Page</div>
<div id="historyPage" class="page">History</div>
<div id="referralPage" class="page">Referral</div>
<div id="adminPage" class="page">Admin</div>
<div id="profilePage" class="page">Profile</div>

<div class="nav">
<button onclick="showPage('homePage')" class="active"><div>🏠</div><span>Home</span></button>
<button onclick="showPage('marketPage')"><div>📊</div><span>Market</span></button>
<button onclick="showPage('investPage')"><div>💰</div><span>Invest</span></button>
<button onclick="showPage('withdrawPage')"><div>💳</div><span>Withdraw</span></button>
<button onclick="showPage('historyPage')"><div>📈</div><span>History</span></button>
<button onclick="showPage('referralPage')"><div>👥</div><span>Referral</span></button>
<button onclick="showPage('adminPage')"><div>🛡️</div><span>Admin</span></button>
<button onclick="showPage('profilePage')"><div>👤</div><span>Profile</span></button>
</div>
</div>

<script>
const BASE_URL="https://kingcoinsinvesment.github.io/Victor-/";
const WHATSAPP_ADMIN="2346587483968"; // CHANGE TO YOUR WHATSAPP WITH 234
const ADMIN_CODE="KING123";

let currentUser=JSON.parse(localStorage.getItem('kingUser'))||null;
let balance=parseFloat(localStorage.getItem('kingBalance'))||1000;
let allUsers=JSON.parse(localStorage.getItem('allKingUsers'))||[];
let withdrawals=JSON.parse(localStorage.getItem('kingWithdrawals'))||[];

// MARKET DATA WITH HOLDINGS
let marketCoins=[
{name:"Bitcoin",symbol:"BTC",icon:"₿",price:65000000,change:2.5,holding:0},
{name:"Ethereum",symbol:"ETH",icon:"Ξ",price:3200000,change:-1.2,holding:0},
{name:"King Coin",symbol:"KING",icon:"👑",price:500,change:5.8,holding:0},
{name:"USDT",symbol:"USDT",icon:"💵",price:1600,change:0.1,holding:0}
];

function showPopup(t,m){document.getElementById('popupTitle').innerText=t;document.getElementById('popupMessage').innerText=m;document.getElementById('popup').style.display='flex';}
function closePopup(){document.getElementById('popup').style.display='none';}

function init(){if(currentUser){document.getElementById('authScreen').style.display='none';document.getElementById('app').style.display='block';updateUI();loadMarket();}else{document.getElementById('authScreen').style.display='flex';document.getElementById('app').style.display='none';}}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}

function login(){const e=document.getElementById('loginEmail').value,p=document.getElementById('loginPass').value;const u=allUsers.find(x=>x.email==e&&x.pass==p);if(u){currentUser=u;balance=u.balance;init();}else{showPopup('Error','Invalid login');}}

function updateUI(){document.getElementById('balance').innerText=balance.toFixed(2);}

// 1. BUY/SELL FUNCTION
function buyCoin(symbol){
  const coin=marketCoins.find(c=>c.symbol==symbol);
  if(balance<coin.price){showPopup('Error','Not enough balance');return;}
  balance-=coin.price;
  coin.holding+=1;
  currentUser.balance=balance;
  saveUser();
  showPopup('Bought!',`You bought 1 ${symbol} for ₦${coin.price.toLocaleString()}`);
  updateUI();loadMarket();
}

function sellCoin(symbol){
  const coin=marketCoins.find(c=>c.symbol==symbol);
  if(coin.holding<=0){showPopup('Error','You dont own this coin');return;}
  balance+=coin.price;
  coin.holding-=1;
  currentUser.balance=balance;
  saveUser();
  showPopup('Sold!',`You sold 1 ${symbol} for ₦${coin.price.toLocaleString()}`);
  updateUI();loadMarket();
}

function loadMarket(){
  const list=document.getElementById('marketList');
  list.innerHTML=marketCoins.map(coin=>{
    const changeClass=coin.change>=0?'change-up':'change-down';
    const arrow=coin.change>=0?'▲':'▼';
    return `<div class="coin">
      <div class="coin-top">
        <div class="coin-left"><div class="coin-icon">${coin.icon}</div><div><div class="coin-name">${coin.name}</div><div style="color:var(--text2)">Owned: ${coin.holding}</div></div></div>
        <div><div class="coin-price">₦${Math.round(coin.price).toLocaleString()}</div><div class="coin-change ${changeClass}">${arrow} ${Math.abs(coin.change)}%</div></div>
      </div>
      ${symbol=='KING'?`<div class="trade-box"><button class="btn btn-buy" onclick="buyCoin('${coin.symbol}')">Buy</button><button class="btn btn-sell" onclick="sellCoin('${coin.symbol}')">Sell</button></div>`:''}
    </div>`
  }).join('');
}

// Update prices every 3s
setInterval(()=>{marketCoins.forEach(c=>{c.change=(Math.random()*4-2).toFixed(2);c.price=c.price*(1+c.change/100)});if(document.getElementById('marketPage').classList.contains('active'))loadMarket();},3000);

function saveUser(){let i=allUsers.findIndex(x=>x.email==currentUser.email);allUsers[i]=currentUser;localStorage.setItem('allKingUsers',JSON.stringify(allUsers));localStorage.setItem('kingUser',JSON.stringify(currentUser));localStorage.setItem('kingBalance',balance);}

// 2. WHATSAPP NOTIFICATION ON WITHDRAW
function withdraw(){const amt=7000;const acc="1234567890";const name="TEST";
if(balance<amt){showPopup('Error','Insufficient');return;}
balance-=amt;currentUser.balance=balance;
const msg=`🚨 NEW WITHDRAWAL REQUEST 🚨%0AName: ${currentUser.name}%0AEmail: ${currentUser.email}%0AAmount: ₦${amt}%0AAccount: ${acc}`;
window.open(`https://wa.me/${WHATSAPP_ADMIN}?text=${msg}`,'_blank'); // THIS SENDS TO YOUR WHATSAPP
saveUser();showPopup('Success','Withdrawal sent. Check WhatsApp');updateUI();}
init();
</script>
</body>
</html>
