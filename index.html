<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>King Coins 👑</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:white;padding-bottom:80px}.page{display:none;padding:20px}.page.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:2px solid #FFD700}.nav button{background:none;border:none;color:#aaa;font-size:12px;cursor:pointer;padding:8px}.nav button.active{color:#FFD700}.card{background:#1a1a1a;padding:20px;border-radius:15px;margin:15px 0;border:1px solid #333}.btn{background:#FFD700;color:black;border:none;padding:12px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}.btn-wa{background:#25D366;color:white}#welcomePopup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;z-index:999}#welcomePopup div{background:#1a1a1a;padding:30px;border-radius:15px;text-align:center;border:2px solid #FFD700}#welcomePopup h2{color:#FFD700}</style></head><body><div id="welcomePopup"><div><h2>Welcome! 👑</h2><p id="welcomeText">You were invited by: GUEST</p><button class="btn" onclick="document.getElementById('welcomePopup').style.display='none'">Continue</button></div></div><div id="homePage" class="page active"><h1>King Coins 👑</h1><div class="card"><h2>Balance: 0.00 KC</h2><p>Earn by mining and referrals</p></div></div><div id="referralPage" class="page"><h1>👑 Referral</h1><p>Invite people to join King Coins and earn rewards.</p><div class="card" style="background:linear-gradient(135deg,#FFD700,#FFA500)"><h2 style="color:black;text-align:center">Invite & Earn</h2><p style="color:black;font-weight:bold">Your Code:</p><div id="refCodeBox" style="background:black;color:#FFD700;padding:12px;border-radius:8px;font-size:18px;font-weight:bold;text-align:center;margin:10px 0">KING-MELODY</div><button class="btn" onclick="copyCode()">Copy Code</button><p style="color:black;font-weight:bold;margin-top:15px">Your Link:</p><div id="refLinkBox" style="background:#222;color:white;padding:12px;border-radius:8px;font-size:12px;word-break:break-all;margin:10px 0">loading...</div><button class="btn" id="copyLinkBtn">Copy Link</button><button class="btn btn-wa" id="waBtn">📱 Share on WhatsApp</button></div></div><div class="nav"><button onclick="showPage('homePage')" class="active">Home</button><button onclick="showPage('referralPage')">Referral</button></div><script>const USER_REF_CODE="KING-MELODY";const BASE_URL="https://gmailcom-cpu.github.io";const REF_LINK=`${BASE_URL}?ref=${USER_REF_CODE}`;function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.querySelector(`[onclick="showPage('${id}')"]`).classList.add('active')}document.getElementById('refLinkBox').innerText=REF_LINK;document.getElementById('refCodeBox').innerText=USER_REF_CODE;function copyCode(){navigator.clipboard.writeText(USER_REF_CODE);alert("Referral code copied!")}document.getElementById('copyLinkBtn').onclick=()=>{navigator.clipboard.writeText(REF_LINK);alert("Invite link copied!")};document.getElementById('waBtn').onclick=()=>{const message=`Join King Coins and earn rewards! 🔥\n\nUse my referral link to get started:\n${REF_LINK}`;window.open(`https://wa.me/?text=${encodeURIComponent(message)}`,'_blank')};window.onload=()=>{const urlParams=new URLSearchParams(window.location.search);const ref=urlParams.get('ref');if(ref){document.getElementById('welcomeText').innerText=`You were invited by: ${ref}`;document.getElementById('welcomePopup').style.display='flex';localStorage.setItem('referrer',ref)}};</script></body></html>
